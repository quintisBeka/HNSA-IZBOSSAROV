<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid Auditor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body class="bg-dark text-light">
<div class="d-flex">
<nav class="sidebar p-3">
<h4>🛡 Hybrid</h4><hr>
<a href="{{url_for('dashboard')}}">Dashboard</a>
<a href="{{url_for('scan')}}">{{tr('start_audit')}}</a>
<a href="{{url_for('history')}}">{{tr('history')}}</a>
<a href="{{url_for('logout')}}">Logout</a><hr>
<a href="{{url_for('set_lang', lang='ru')}}">RU</a> | <a href="{{url_for('set_lang', lang='kz')}}">KZ</a>
<p class="small mt-3 text-warning">Только для учебных и разрешенных аудитов.</p>
</nav>
<main class="flex-grow-1 p-4">{% with messages = get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
